<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約キャンセル｜福林楼</title><style>body{margin:0;background:#f7f0e3;color:#292017;font-family:system-ui,"Noto Sans JP",sans-serif;line-height:1.7}.wrap{width:min(650px,calc(100% - 30px));margin:45px auto}.card{padding:28px;background:#fffdfa;border:1px solid #dfd0b7}.brand{color:#8f2b1b;font-weight:700;text-decoration:none}h1{font-size:1.7rem;color:#8f2b1b}label{display:block;margin:16px 0 5px;font-weight:700}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #dfd0b7;font:inherit}button{margin-top:22px;background:#8f2b1b;color:#fff;border:0;padding:13px 22px;font:inherit;cursor:pointer}.notice{margin-top:18px;padding:13px;background:#fff3dd}.back{display:inline-block;margin-top:20px;color:#8f2b1b}</style></head><body><main class="wrap"><a class="brand" href="./">福林楼</a><section class="card"><h1>予約キャンセル</h1><p>予約時に入力した、お名前・メールアドレス・電話番号がすべて一致するとキャンセルできます。</p><form id="cancelForm"><label>お名前<input id="name" required></label><label>メールアドレス<input id="email" type="email" required></label><label>電話番号<input id="phone" type="tel" required></label><button>予約をキャンセルする</button></form><div class="notice" id="result" hidden></div><a class="back" href="./">予約ページへ戻る</a></section></main><script>document.getElementById('cancelForm').addEventListener('submit',async e=>{e.preventDefault();const r=document.getElementById('result');r.hidden=false;r.textContent='確認しています…';try{const x=await fetch('/api/cancellations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,tel:document.getElementById('phone').value})});const j=await x.json();r.textContent=x.ok?'予約（'+j.publicRef+'）をキャンセルしました。':j.error||'キャンセルできませんでした。'}catch{r.textContent='通信できませんでした。お電話でご連絡ください。'}})</script></body></html>
