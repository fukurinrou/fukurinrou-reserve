<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約キャンセル｜福林楼</title><style>body{margin:0;background:#f7f0e3;color:#292017;font-family:system-ui,"Noto Sans JP",sans-serif;line-height:1.7}.wrap{width:min(650px,calc(100% - 30px));margin:45px auto}.card{padding:28px;background:#fffdfa;border:1px solid #dfd0b7}.brand{color:#8f2b1b;font-weight:700;text-decoration:none}h1{font-size:1.7rem;color:#8f2b1b}label{display:block;margin:16px 0 5px;font-weight:700}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #dfd0b7;font:inherit}button{margin-top:22px;background:#8f2b1b;color:#fff;border:0;padding:13px 22px;font:inherit;cursor:pointer}.notice{margin-top:18px;padding:13px;background:#fff3dd}.back{display:inline-block;margin-top:20px;color:#8f2b1b}</style></head><body><main class="wrap"><a class="brand" href="./">福林楼</a><section class="card"><h1>予約キャンセル</h1><p>予約時に入力した、お名前・メールアドレス・電話番号がすべて一致するとキャンセルできます。</p><form id="cancelForm"><label>お名前<input id="name" required></label><label>メールアドレス<input id="email" type="email" required></label><label>電話番号<input id="phone" type="tel" required></label><button id="cancelButton">予約をキャンセルする</button></form><div class="notice" id="result" hidden></div><a class="back" href="./">予約ページへ戻る</a></section></main><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script>const EMAILJS_PUBLIC_KEY='4-GjeeGbTSMza_1ZT',EMAILJS_SERVICE_ID='service_k70sla9',EMAILJS_TEMPLATE_ADMIN='template_0tuz6oa',EMAILJS_TEMPLATE_CUSTOMER='template_j4q2ujf';emailjs.init(EMAILJS_PUBLIC_KEY);document.getElementById('cancelForm').addEventListener('submit',async e=>{e.preventDefault();const r=document.getElementById('result'),b=document.getElementById('cancelButton'),name=document.getElementById('name').value,email=document.getElementById('email').value,tel=document.getElementById('phone').value;r.hidden=false;r.textContent='確認しています…';b.disabled=true;try{const x=await fetch('/api/cancellations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,email,tel})});const j=await x.json();if(!x.ok){r.textContent=j.error||'キャンセルできませんでした。';return}const p={name,email,tel,rtype:'予約キャンセル',title:'予約キャンセル',subject:'【福林楼】予約キャンセルを受け付けました',message:'予約をキャンセルしました。\n受付番号：'+j.publicRef+'\nお名前：'+name+'\n電話番号：'+tel+'\n店舗：福林楼（092-481-1369）',public_ref:j.publicRef};const mail=await Promise.allSettled([emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ADMIN,p),emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_CUSTOMER,p)]);r.textContent=mail.every(x=>x.status==='fulfilled')?'予約（'+j.publicRef+'）をキャンセルしました。店舗とお客様へキャンセル確認メールを送りました。':'予約（'+j.publicRef+'）をキャンセルしました。メール送信に失敗したため、店舗へお電話ください。'}catch{r.textContent='通信できませんでした。お電話でご連絡ください。'}finally{b.disabled=false}})</script></body></html>
